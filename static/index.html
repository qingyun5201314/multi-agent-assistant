<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能AI助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo"><h1>🤖 AI助手</h1></div>
            <button id="newChatBtn" class="btn-new-chat">+ 新对话</button>
            <div id="sessionList" class="session-list"></div>
            <div class="sidebar-footer">
                <div class="panel">
                    <h3>📚 知识库</h3>
                    <button id="loadKnowledge" class="btn">加载 knowledge.txt</button>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf" style="display:none">
                    <button id="uploadBtn" class="btn" style="margin-top:8px;">📎 上传文档</button>
                    <div id="knowledgeStats" class="stats">未加载</div>
                </div>
                <div class="panel">
                    <h3>⚙️ 设置</h3>
                    <label>最大步数 <input type="number" id="maxSteps" value="5" min="1" max="10"></label>
                </div>
            </div>
        </aside>
        
        <main class="chat-area">
            <div id="chatMessages" class="messages">
                <div class="welcome">
                    <h2>👋 你好！我是多功能AI助手</h2>
                    <p>支持语音对话、RAG问答、图像生成、联网搜索等。</p>
                </div>
            </div>
            
            <div class="input-area">
                <button id="micBtn" class="btn btn-mic" title="按住说话">🎤</button>
                <textarea id="userInput" placeholder="输入你的问题...（按 Enter 发送，Shift+Enter 换行）"></textarea>
                <button id="sendBtn" class="btn btn-send">发送</button>
                <button id="speakerBtn" class="btn btn-mic" title="开启/关闭语音播报" style="margin-left: 10px;">🔊</button>
            </div>
        </main>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
